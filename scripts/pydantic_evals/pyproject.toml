[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "pydantic-evals"
version = "0.1.0"
description = "Pydantic Evals — forked from pydantic-ai, built from upstream source (unchanged)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.9.4",
    "logfire-api>=3.14.1",
    "pydantic>=2.12",
    "pydantic-ai-slim>=2.33",
    "anyio>=4.7.0",
    "pyyaml>=6.0.2",
    "typing-extensions>=4.0",
]
[project.optional-dependencies]
logfire = ["logfire>=3.14.1"]
[tool.hatch.build.targets.wheel]
packages = ["pydantic_evals"]
